<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102B3A">
<title>オフラインです | Welltect</title>
<!--
  オフライン時にホーム画面起動で出す案内 (正本: docs/elith/AI疾病予防報告書_仕様書.md §4.4)。

  【この 1 枚だけがキャッシュされる】manifest が display:standalone なので、SW が無いと
  ホーム画面から起動したときに**アプリの見た目のままブラウザのエラー画面**が出る。
  それを避けるためだけの静的ページ。

  【検査データは 1 文字も置かない】ページはキャッシュに入る = 端末のロックが解ければ
  誰でも読める。だから**個人のデータも、認証を通さないと出せないものも書かない**。
  CSS も外部ファイルにしない (ビルドのハッシュ名は SW がキャッシュしないため、
  オフラインでは読み込めない)。
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    background: #F7F5EF; color: #1F2A2E;
    font-family: "BIZ UDGothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.75;
  }
  .box { width: 100%; max-width: 26rem; }
  h1 { margin: 0 0 .75rem; font-size: 1.25rem; line-height: 1.5; }
  p { margin: 0 0 1rem; }
  ol { margin: 0 0 1.25rem; padding-left: 1.3rem; }
  li { margin-bottom: .4rem; }
  .card {
    background: #fff; border: 1px solid #D9D5CC;
    border-radius: 1rem; padding: 1.25rem;
  }
  .rule { border-top: 1px solid #E4E0D7; margin: 1.25rem 0 1rem; }
  .note { font-size: .9rem; color: #4A4A4A; }
  button {
    -webkit-appearance: none; appearance: none;
    width: 100%; min-height: 44px; border: 0; border-radius: .75rem;
    background: #287F86; color: #fff;
    font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #20666C; }
</style>
</head>
<body>
  <div class="box">
    <div class="card">
      <h1>通信できませんでした</h1>
      <p>Welltect の画面は、通信できるときに読み込みます。電波の届く場所で、もう一度お試しください。</p>
      <ol>
        <li>機内モードが入っていないか確認します。</li>
        <li>Wi‑Fi またはモバイル通信を入れ直します。</li>
        <li>下のボタンで読み込み直します。</li>
      </ol>
      <button type="button" onclick="location.reload()">読み込み直す</button>

      <div class="rule"></div>
      <p class="note">
        AI疾病予防報告書を端末に保存してある場合は、通信ができないときでも
        「ファイル」アプリからそのまま読めます。
      </p>
    </div>
  </div>
</body>
</html>
