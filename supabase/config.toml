# Supabase CLI config (https://supabase.com/docs/guides/cli/config)
# Run `supabase start` to launch the local stack (Postgres + Studio + Auth + Storage)
# Run `supabase db reset` to apply migrations + seed.sql

project_id = "scan-chat-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "customer", "diagnosis", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
# seed.sql (顧客/検査) → seed_notices.sql (お知らせ) → seed_measurements.sql (検査値) の順に適用。
# seed_measurements.sql は seed.sql が作った artifact を日付で突合するため、必ず後に置く。
sql_paths = ["./seed.sql", "./seed_notices.sql", "./seed_measurements.sql", "./seed_kit_demo.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083
