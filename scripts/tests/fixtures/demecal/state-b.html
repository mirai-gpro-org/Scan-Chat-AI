<!-- 完全架空の fixture。条件入力の画面。
     ・日付は必須で初期は空
     ・検査結果 / 項目見出しは radio。**既定は「出力しない」**
     ・実行の指示は hidden submitType に、押したボタン自身の onclick が入れる -->
<html><body>
<form method="post" action="/hanyou/entry">
  <input name="__RequestVerificationToken" type="hidden" value="TOKEN2" />
  <input type="hidden" id="ID" name="ID" value="1" />
  <input readonly type="text" id="DairitenCode" name="DairitenCode" value="Q05-0010" />
  <input type="hidden" id="HanbaitenCode" name="HanbaitenCode" value="000000" />
  <input type="text" id="DateFrom" name="DateFrom" value="" />
  <input type="text" id="DateTo" name="DateTo" value="" />
  <input type="radio" id="DataType1" name="DataType" value="0" checked /><label for="DataType1">すべて</label>
  <input type="radio" id="DataType2" name="DataType" value="1" /><label for="DataType2">正常終了のみ</label>
  <input type="radio" id="OutputHeader1" name="OutputHeader" value="False" checked /><label for="OutputHeader1">出力しない</label>
  <input type="radio" id="OutputHeader2" name="OutputHeader" value="True" /><label for="OutputHeader2">出力する</label>
  <input type="hidden" id="submitType" name="submitType" value="" />
  <button id="btnConfirm" type="button" onclick="submitType.value='confirm'; submit();">確認</button>
  <button id="btnBack" type="button" onclick="submitType.value='back'; submit();">戻る</button>
</form>
</body></html>
