<!-- 完全架空の fixture。**decoy が対象より項目数が多い**画面。
     旧 Select-Form は「token 以外の項目がいちばん多い form」を採っていたので、
     この検索 form (14 項目) を掴んで条件入力 form (実測の STATE B = 11 項目) を
     取り逃した。期待状態に一致する form を選ぶ方式なら正しく条件入力を採る。
     ※ 項目数は「decoy > 対象」でありさえすればよい (T05d がその前提を機械で見る)。
        実測 form を fixture に取り込んだ際に 11 対 11 で並んでしまい前提が崩れたので
        Keyword を 14 まで増やした (2026-09-03)。 -->
<html><body>
<form method="post" action="/search">

  <input type="text" name="Keyword11" value="" /><input type="text" name="Keyword12" value="" />
  <input type="text" name="Keyword13" value="" /><input type="text" name="Keyword14" value="" />
  <button type="submit">検索</button>
</form>
<form class="form-horizontal" name="myform" action="/hanyou/entry" method="post">
<input class="form-control" type="hidden" data-val="true" data-val-required="The ID field is required." id="ID" name="ID" value="0" />
<label class="col-sm-2 control-label">代理店</label>
<input class="form-control" readonly type="text" id="DairitenCode" name="DairitenCode" value="Q05-0010" />
<input class="form-control" readonly type="text" id="DairitenName" name="DairitenName" value="&#x682A;&#x5F0F;&#x4F1A;&#x793E;" />

<input class="form-control" readonly type="text" id="HanbaitenCode" name="HanbaitenCode" value="000000" />
<input class="form-control" readonly type="text" id="HanbaitenName" name="HanbaitenName" value="&#x682A;&#x5F0F;&#x4F1A;&#x793E;" />
<label class="col-sm-2 control-label">結果承認日</label>
<input type='text' class="form-control" id="DateFrom" name="DateFrom" value="" />
<input type='text' class="form-control" id="DateTo" name="DateTo" value="" />
<label class="col-sm-2 control-label">検査結果</label>
<label class="radio-inline">
<input type="radio" value="0" checked="checked" data-val="true" data-val-required="The DataType field is required." id="DataType" name="DataType">すべて</label>
<label class="radio-inline">
<input type="radio" value="1" id="DataType" name="DataType">正常終了のみ</label>
<label class="col-sm-2 control-label">項目見出し</label>

<label class="radio-inline">
<input type="radio" value="True" id="OutputHeader" name="OutputHeader">出力する</label>
<button id="btnSubmit" type="button" class="btn btn-default">確認</button>
<button id="btnBack" type="button" class="btn btn-default">戻る</button>
<input id="submitType" name="submitType" class="form-control" type="hidden" />
<input name="__RequestVerificationToken" type="hidden" value="DUMMY-ANTIFORGERY-TOKEN" />
</form>
<form method="post" action="/account/logout"><button type="submit">ログアウト</button></form>
<script src="/lib/jquery/dist/jquery.js"></script>

            locale: 'ja',
            format: 'YYYY/MM/DD',
        });
        $('#datepicker2').datetimepicker({
            locale: 'ja',
            format: 'YYYY/MM/DD',
        });

        $("#btnSubmit").click(function () {
            dispLoading('処理中...');
            document.myform.submit();
        });

        $("#btnBack").click(function () {
            $('#submitType').val('back');
            document.myform.submit();
        });
</script>
